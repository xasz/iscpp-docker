services:

  iscpp-app:
    image: ghcr.io/xasz/iscpp:latest
    restart: unless-stopped
    depends_on:
      - iscpp-postgres
    volumes:
      - ./certs/ca.crt:/tmp/custom-ca.crt:ro
      - iscpp-env:/var/www/env-volume
      - iscpp-storage:/var/www/storage
      - iscpp-public:/var/www/public-volume
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: iscpp-postgres
      DB_PORT: 5432
      DB_DATABASE: iscpp-db
      DB_USERNAME: iscpp-db-user
      DB_PASSWORD: ThisIsASecretPasswordButYouShouldChangeIt
      IMPORT_CUSTOM_CA: "1"
    networks:
      - iscpp-net
    command: sh -c "
      echo 'Copying public assets...';
      cp -r /var/www/public/* /var/www/public-volume/;
      exec php-fpm"

  iscpp-worker:
    image: ghcr.io/xasz/iscpp:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3
    depends_on:
      - iscpp-postgres
      - iscpp-app
    volumes:
      - ./certs/ca.crt:/tmp/custom-ca.crt:ro
      - iscpp-env:/var/www/env-volume
      - iscpp-storage:/var/www/storage
    environment:
      IMPORT_CUSTOM_CA: "1"
    networks:
      - iscpp-net


  iscpp-scheduler:
    image: ghcr.io/xasz/iscpp:latest
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - iscpp-postgres
      - iscpp-app
    volumes:
      - iscpp-env:/var/www/env-volume
      - iscpp-storage:/var/www/storage
    networks:
      - iscpp-net

  iscpp-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - iscpp-app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - iscpp-public:/var/www/public:ro
    networks:
      - iscpp-net

  iscpp-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iscpp-db
      POSTGRES_USER: iscpp-db-user
      POSTGRES_PASSWORD: ThisIsASecretPasswordButYouShouldChangeIt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iscpp-net

volumes:
  postgres-data:
  iscpp-env:
  iscpp-storage:
  iscpp-public:

networks:
  iscpp-net:
